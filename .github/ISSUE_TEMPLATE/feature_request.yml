name: 💡 Feature Request
description: Suggest an idea, improvement, or new tab/view
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea that would make this tool more useful? Tell us about it — real workflows and pain points make the strongest case.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point that led to this request.
      placeholder: |
        I have to manually cross-reference the Optimization tab with our internal group naming convention every time, which takes a while on large projects.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? A new tab, an export format, a filter, an AI report mode, etc.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Overview
        - Bundles
        - Assets
        - Duplicates
        - Optimization
        - Dependencies
        - Build Diff
        - AI Report
        - Report loading / parsing
        - Exports (CSV / JSON / Markdown)
        - New feature / new tab
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're currently using, or other tools that do this.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
